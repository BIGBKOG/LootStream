<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LootStream Linux Host — Media Center</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
      <div class="brand-card">
        <div class="brand-logo">LS</div>
        <div class="brand-meta">
          <div class="brand-title">LOOTSTREAM</div>
          <div class="brand-sub" id="brand-platform-sub">MEDIA HOST</div>
        </div>
      </div>

      <div class="status-pill" id="host-status-pill">
        <span class="pulse-dot"></span>
        <span id="host-status-text">ONLINE</span>
      </div>

      <nav class="nav-list" id="sidebar-nav">
        <button class="nav-btn active" data-view="home">
          <span class="nav-icon">&#9673;</span>
          <span>Home</span>
        </button>
        <button class="nav-btn" data-view="movies">
          <span class="nav-icon">&#127909;</span>
          <span>Movies</span>
          <span class="nav-count" id="count-movies">0</span>
        </button>
        <button class="nav-btn" data-view="shows">
          <span class="nav-icon">&#128250;</span>
          <span>TV Shows</span>
          <span class="nav-count" id="count-shows">0</span>
        </button>
        <button class="nav-btn" data-view="music">
          <span class="nav-icon">&#9835;</span>
          <span>Music</span>
          <span class="nav-count" id="count-music">0</span>
        </button>
        <button class="nav-btn" data-view="host">
          <span class="nav-icon">&#9881;</span>
          <span>Host &amp; Folders</span>
        </button>
      </nav>

      <div class="sidebar-connect-box">
        <div class="connect-label">EASY WI-FI LOGIN CODE</div>
        <div class="sidebar-code-row">
          <div class="sidebar-code-val" id="sidebar-quick-code">------</div>
          <button class="btn-outline btn-sm" id="btn-refresh-code" title="New 6-digit code">&#8635;</button>
        </div>
        <div class="connect-label" style="margin-top:4px;">ANDROID LAN URL</div>
        <div class="connect-url" id="sidebar-lan-url">http://127.0.0.1:8765</div>
        <button class="btn-secondary btn-sm" id="btn-copy-lan">Copy URL</button>
      </div>
    </aside>

    <!-- Main Content Viewport -->
    <div class="main-area">
      <header class="topbar">
        <div class="search-wrap">
          <span class="search-icon">&#128269;</span>
          <input
            type="search"
            id="search-input"
            placeholder="Search movies, TV shows, episodes, music tracks..."
            autocomplete="off"
          />
        </div>
        <div class="topbar-actions">
          <button class="btn-outline" id="btn-rescan">&#8635; Rescan Library</button>
          <button class="btn-primary" id="btn-quick-add-folder">+ Add Folder</button>
        </div>
      </header>

      <main class="view-container" id="view-container">
        <!-- Populated dynamically by app.js -->
      </main>
    </div>
  </div>

  <!-- Persistent Bottom Music Player Dock -->
  <div class="music-dock hidden" id="music-dock">
    <div class="music-dock-left">
      <div class="music-art" id="music-dock-art">&#9835;</div>
      <div class="music-info">
        <div class="music-title" id="music-dock-title">No track playing</div>
        <div class="music-sub" id="music-dock-sub">LootStream Audio Engine</div>
      </div>
    </div>
    <div class="music-dock-center">
      <div class="music-controls">
        <button class="icon-btn" id="music-prev" title="Previous">&#9198;</button>
        <button class="play-circle-btn" id="music-play-pause" title="Play / Pause">&#9654;</button>
        <button class="icon-btn" id="music-next" title="Next">&#9197;</button>
      </div>
      <div class="music-progress-row">
        <span class="time-label" id="music-time-cur">00:00</span>
        <input type="range" id="music-seek" min="0" max="1000" value="0" />
        <span class="time-label" id="music-time-dur">00:00</span>
      </div>
    </div>
    <div class="music-dock-right">
      <span class="vol-label">&#128266;</span>
      <input type="range" id="music-volume" min="0" max="1" step="0.02" value="0.9" />
      <button class="icon-btn" id="music-close" title="Close">&#10005;</button>
    </div>
    <audio id="audio-player" preload="metadata"></audio>
  </div>

  <!-- Fullscreen Theater Video Player Modal -->
  <div class="theater-modal hidden" id="theater-modal">
    <div class="theater-header">
      <div>
        <div class="theater-title" id="theater-title">Playing Video</div>
        <div class="theater-subtitle" id="theater-subtitle">Linux Host Direct Stream</div>
      </div>
      <div class="theater-actions">
        <button class="btn-outline btn-sm" id="theater-fav-btn">&#9734; Favorite</button>
        <button class="btn-outline btn-sm" id="theater-watched-btn">&#10003; Mark Watched</button>
        <select id="theater-speed" class="speed-select" title="Playback Speed">
          <option value="0.75">0.75x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
        <button class="btn-outline btn-sm" id="theater-fit-btn">Fit</button>
        <button class="btn-outline btn-sm" id="theater-next-btn">Next &#9197;</button>
        <button class="btn-danger btn-sm" id="theater-close-btn">&#10005; Close</button>
      </div>
    </div>
    <div class="theater-stage">
      <video id="video-player" controls playsinline autoplay></video>
    </div>
    <div class="theater-footer">
      <button class="btn-secondary btn-sm" id="theater-rew-btn">-10s</button>
      <button class="btn-secondary btn-sm" id="theater-fwd-btn">+10s</button>
      <span class="theater-sync-status" id="theater-sync-status">Watch progress auto-syncs with Android</span>
    </div>
  </div>

  <!-- Directory Browser Modal -->
  <div class="modal-backdrop hidden" id="folder-modal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="folder-modal-title">Add Media Folder</h3>
        <button class="icon-btn" id="folder-modal-close">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="folder-path-row">
          <input type="text" id="folder-manual-input" placeholder="/home/user/Videos" />
          <button class="btn-primary btn-sm" id="btn-add-current-dir">Add This Path</button>
          <button class="btn-outline btn-sm" id="btn-native-picker">OS Picker</button>
        </div>
        <div class="dir-breadcrumb">
          <button class="btn-outline btn-sm" id="btn-dir-up">&#8593; Up</button>
          <span id="dir-current-label">/home</span>
        </div>
        <div class="dir-list" id="dir-list"></div>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
